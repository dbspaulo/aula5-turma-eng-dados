name: Pipeline com Validação de Dataset

on:
  push:
    branches:
      - main  # Garante a execução na branch principal
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-metricas
  cancel-in-progress: false

# Permissão necessária para o pipeline conseguir commitar o CSV de volta no repositório
permissions:
  contents: write

jobs:
  validar-indicadores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivo de indicadores
        run: |
          if [ ! -f docs/indicadores.md ]; then
            echo "Arquivo indicadores.md não encontrado!"
            exit 1
          fi

          count=$(grep -c "-" docs/indicadores.md)

          if [ $count -lt 3 ]; then
            echo "Defina pelo menos 3 métricas!"
            exit 1
          fi

          echo "Indicadores validados com sucesso!"

  validar-dataset:
    runs-on: ubuntu-latest
    needs: validar-indicadores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          pip install pandas

      - name: Validar métricas do dataset
        run: |
          python scripts/validar_metricas.py

  simular-metricas:
    runs-on: ubuntu-latest
    needs: validar-dataset

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Utiliza o token automático com permissão de escrita configurada acima
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Executar simulação de métricas
        run: |
          python scripts/simular_metricas.py

      - name: Verificar arquivos gerados
        run: |
          echo "Estrutura de arquivos:"
          ls -R
          echo ""
          echo "Conteúdo do CSV:"
          cat dados/historico_metricas.csv || echo "CSV não encontrado"

      # PASSO CHAVE: Salva as alterações de métricas de forma permanente no repositório Git
      - name: Commitar e persistir histórico de dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona os arquivos gerados/modificados pelo script Python
          git add dados/historico_metricas.csv resultados.json
          git commit -m "chore: atualiza histórico de métricas automaticamente [skip ci]" || true
          
          # PASSO CHAVE: Sincroniza com o que o outro pipeline enviou antes de empurrar
          git pull --rebase origin main
          git push

      - name: Publicar JSON como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: resultados-metricas-json
          path: resultados.json

      - name: Publicar CSV histórico como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: historico-metricas-csv
          path: dados/historico_metricas.csv